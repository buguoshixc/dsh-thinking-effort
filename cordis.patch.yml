# dsh-thinking-effort bundle layer: mounts the plugin into a dsh profile's host
# composition. `dsh plugin --profile <name> add <package>` pnpm-installs the
# package into the profile and reconciles it into the profile's
# `dsh.profile.bundles` list, after which this patch inserts the plugin row
# below.
#
# The plugin keeps NO declaration state of its own: the `llm-pi-ai` section is
# the single source of truth for what a model offers, and a declaration is a
# one-shot edit of it made with `/thinking set` or the settings tab. So there is
# nothing here to keep in sync — only the two preferences below.
- insert:
    - id: thinking-effort
      # Node-resolvable package name — must stay in sync with package.json `name`.
      name: 'dsh-thinking-effort'
      config:
        # Log one capability report at load, naming every route whose thinking
        # intensity still cannot be adjusted, so a newly added third-party key is
        # noticed immediately rather than the first time the model picker opens.
        diagnoseOnStart: true
        # Preset pre-selected in the settings tab. Deliberately the one that sends
        # only the parameter an OpenAI-compatible endpoint already understands.
        defaultPreset: openai-null-off
